name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Types, lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint & format check
        run: npm run lint

      - name: Build
        run: npm run build

      # The compiled output in js/ is committed so the site can be served
      # straight from the repo. If a build produces something different
      # from what was committed, the two have drifted apart.
      - name: Verify committed js/ matches ts/
        run: |
          if [ -n "$(git status --porcelain js/)" ]; then
            echo "::error::js/ is out of date with ts/. Run 'npm run build' and commit the result."
            git --no-pager diff --stat js/
            exit 1
          fi
          echo "js/ is in sync with ts/"

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
        continue-on-error: true

  accessibility:
    name: Accessibility (pa11y)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Serve site
        run: npx --yes serve --listen 8000 . &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:8000 --timeout 60000

      - name: Run pa11y (WCAG 2.1 AA)
        run: npx --yes pa11y --standard WCAG2AA --runner axe --runner htmlcs http://localhost:8000
        continue-on-error: true
